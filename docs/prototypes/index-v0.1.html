<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Codexia — Aprenda C</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0ff;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #22d3ee;outline-offset:3px}.shell{display:flex;min-height:100vh}.sidebar{width:240px;background:#101728;border-right:1px solid #293449;padding:26px 16px;position:sticky;top:0;height:100vh}.logo{font-size:25px;font-weight:850;letter-spacing:-1px;margin:0 10px 34px}.logo span{color:#22d3ee}.nav{width:100%;background:none;border:0;color:#a7b4ce;text-align:left;padding:13px 14px;border-radius:12px;margin-bottom:7px}.nav:hover,.nav.active{background:#252041;color:#fff}.main{flex:1;min-width:0;padding:36px max(24px,5vw);max-width:1350px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}.eyebrow{font-size:12px;color:#22d3ee;letter-spacing:1.5px;font-weight:750;text-transform:uppercase}h1{font-size:clamp(28px,4vw,43px);letter-spacing:-1.3px;margin:8px 0}h2{font-size:20px;margin:0 0 14px}p{color:#a7b4ce;line-height:1.65}.panel{background:#151d30;border:1px solid #293449;border-radius:20px;padding:24px}.hero{background:linear-gradient(120deg,#221c48,#151d30 70%);padding:32px}.button{border:0;background:#8b5cf6;color:white;border-radius:11px;padding:12px 18px;font-weight:750}.button:hover{background:#7945e9}.button.secondary{background:#28334a}.button:disabled{opacity:.5;cursor:not-allowed}.stats,.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0 28px}.stat strong{font-size:27px}.stat small{display:block;color:#a7b4ce;margin-top:5px}.bar{height:9px;border-radius:30px;background:#30394f;overflow:hidden;margin:16px 0}.fill{height:100%;background:#8b5cf6;transition:width .3s}.lesson{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px;margin:12px 0;background:#151d30;border:1px solid #293449;border-radius:15px}.lesson.done{border-color:#225d4c}.muted{color:#a7b4ce}.tag{font-size:12px;color:#86efac;background:#173d35;padding:5px 10px;border-radius:50px}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#0b1020;border:1px solid #293449;color:#93e6ff;padding:18px;border-radius:12px;white-space:pre-wrap;overflow:auto;line-height:1.6}.choice{display:block;width:100%;text-align:left;background:#1b263b;color:#eaf0ff;border:1px solid #35425b;border-radius:12px;padding:14px;margin:10px 0}.choice.selected{border-color:#8b5cf6;background:#2a234d}.feedback{padding:14px;border-radius:12px;margin:16px 0;background:#22314b}.success{color:#86efac}.error{color:#ff9caa}.editor{width:100%;min-height:260px;resize:vertical;border:1px solid #35425b;border-radius:12px;background:#0b1020;color:#d6f3ff;padding:18px;font:14px/1.65 ui-monospace,Consolas,monospace}.two{display:grid;grid-template-columns:2fr 1fr;gap:18px}.hidden{display:none}.mobilebar{display:none}.badge{background:#242f48;padding:8px 12px;border-radius:12px;color:#fbbf24}.foot{margin-top:40px;font-size:12px;color:#74819c}.achievement{font-size:32px}.listrow{padding:12px 0;border-bottom:1px solid #293449}.listrow:last-child{border:0}@media(max-width:850px){.sidebar{display:none}.mobilebar{display:flex;position:sticky;bottom:0;z-index:5;background:#101728;border-top:1px solid #293449;justify-content:space-around;padding:10px}.mobilebar button{background:none;color:#c5cce0;border:0;padding:9px;font-size:12px}.shell{display:block}.main{padding:24px 16px 40px}.stats,.cards,.two{grid-template-columns:1fr}.hero{padding:22px}.top{align-items:flex-start}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="logo">&lt;/&gt; codexia<span>_</span></div><nav id="nav"></nav><div class="foot">PROTÓTIPO v0.1<br>Aprenda. Programe. Evolua.</div></aside><main class="main"><div class="top"><div><div class="eyebrow">Sua jornada começa aqui</div><h1 id="title">Dashboard</h1></div><div class="badge" id="xpBadge">⚡ 0 XP</div></div><div id="content"></div></main></div><nav class="mobilebar" id="mobileNav"></nav><script>
const KEY='codexia-demo-v1';const defaults={xp:0,completed:[],streak:0,attempts:0};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...defaults}};let page='dashboard',selected=null,feedback='',editorText='#include <stdio.h>\n\nint main(void) {\n    printf("Olá, Codexia!\\n");\n    return 0;\n}';const lessons=[{id:1,title:'O que é programar?',desc:'Conheça algoritmos e instruções.',q:'O que é um algoritmo?',opts:['Um conjunto de instruções para resolver um problema','Uma linguagem exclusiva de computadores','Um tipo de computador'],correct:0,explain:'Um algoritmo é uma sequência finita de passos para realizar uma tarefa.'},{id:2,title:'Seu primeiro programa em C',desc:'Conheça main e printf.',q:'Qual função usamos para mostrar uma mensagem na tela em C?',opts:['scanf','printf','cout'],correct:1,explain:'printf(), declarada em stdio.h, escreve texto na saída padrão.'},{id:3,title:'Variáveis e números',desc:'Aprenda a guardar valores.',q:'Qual declaração cria uma variável inteira chamada idade?',opts:['int idade;','float = idade;','idade int;'],correct:0,explain:'Em C, declaramos primeiro o tipo e depois o nome da variável.'},{id:4,title:'Decisões com if',desc:'Faça o programa tomar decisões.',q:'Qual palavra-chave representa uma condição em C?',opts:['when','if','check'],correct:1,explain:'if permite executar um bloco quando uma condição é verdadeira.'}];let currentLesson=1;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function unlocked(id){return id===1||state.completed.includes(id-1)}function navTo(p){page=p;selected=null;feedback='';render()}function finish(id){if(!state.completed.includes(id)){state.completed.push(id);state.xp+=25;save()}feedback='success';render()}function choose(i){selected=i;feedback='';render()}function check(){state.attempts++;save();if(selected===lessons[currentLesson-1].correct)finish(currentLesson);else{feedback='error';render()}}function start(id){if(!unlocked(id))return;currentLesson=id;navTo('lesson')}
const items=[['dashboard','⌂','Dashboard'],['trilha','◇','Trilha de C'],['editor','⌘','Editor C'],['conquistas','★','Conquistas'],['perfil','◉','Perfil']];function navHTML(mobile=false){return items.map(([id,ic,label])=>`<button class="${mobile?'':'nav '}${page===id?'active':''}" onclick="navTo('${id}')">${ic} ${mobile?label.split(' ')[0]:label}</button>`).join('')}
function dashboard(){const pct=Math.round(state.completed.length/lessons.length*100),next=lessons.find(l=>!state.completed.includes(l.id));return `<div class="panel hero"><div class="eyebrow">TRILHA: FUNDAMENTOS DE C</div><h1>De zero a programador.</h1><p>Domine os primeiros conceitos de programação com desafios rápidos e progressivos.</p><div class="bar"><div class="fill" style="width:${pct}%"></div></div><p>${pct}% da trilha demonstrativa concluída</p><button class="button" onclick="${next?`start(${next.id})`:`navTo('trilha')`}">${next?'Continuar aprendendo →':'Revisar trilha →'}</button></div><div class="stats"><div class="panel stat">⚡ <strong>${state.xp}</strong><small>XP acumulado</small></div><div class="panel stat">✓ <strong>${state.completed.length}</strong><small>Lições concluídas</small></div><div class="panel stat">⌘ <strong>${state.attempts}</strong><small>Respostas verificadas</small></div></div><h2>Próximos passos</h2><div class="cards"><div class="panel"><h2>◇ Trilha</h2><p>Avance no conteúdo de C.</p><button class="button secondary" onclick="navTo('trilha')">Ver trilha</button></div><div class="panel"><h2>⌘ Editor</h2><p>Experimente escrever código.</p><button class="button secondary" onclick="navTo('editor')">Abrir editor</button></div><div class="panel"><h2>★ Conquistas</h2><p>Acompanhe suas metas.</p><button class="button secondary" onclick="navTo('conquistas')">Ver conquistas</button></div></div>`}
function trail(){return `<div class="panel"><p>Trilha demonstrativa de fundamentos de C. Conclua uma lição para liberar a próxima.</p>${lessons.map(l=>`<div class="lesson ${state.completed.includes(l.id)?'done':''}"><div><strong>${state.completed.includes(l.id)?'✓ ':''}${l.id}. ${l.title}</strong><div class="muted">${l.desc}</div></div><button class="button ${state.completed.includes(l.id)?'secondary':''}" ${unlocked(l.id)?`onclick="start(${l.id})"`:'disabled'}>${state.completed.includes(l.id)?'Revisar':unlocked(l.id)?'Iniciar':'🔒'}</button></div>`).join('')}</div>`}
function lesson(){const l=lessons[currentLesson-1];return `<div class="two"><div class="panel"><div class="eyebrow">LIÇÃO ${l.id} DE ${lessons.length}</div><h2>${l.title}</h2><p>${l.desc}</p><div class="code">#include &lt;stdio.h&gt;\n\nint main(void) {\n    printf("Olá, mundo!\\n");\n    return 0;\n}</div><h2 style="margin-top:22px">${l.q}</h2>${l.opts.map((o,i)=>`<button class="choice ${selected===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}${feedback?`<div class="feedback ${feedback}"><strong>${feedback==='success'?'✓ Resposta correta!':'✕ Tente novamente.'}</strong><p>${feedback==='success'?l.explain:'Revise as opções e tente de novo.'}</p></div>`:''}<button class="button" ${selected===null?'disabled':''} onclick="check()">Verificar resposta</button> <button class="button secondary" onclick="navTo('trilha')">Voltar à trilha</button></div><div class="panel"><h2>Como aprender</h2><p>Leia a pergunta, escolha uma alternativa e verifique sua resposta. Acertos na primeira conclusão concedem 25 XP.</p><p>Erros não removem pontos. Você pode tentar novamente.</p></div></div>`}
function editor(){return `<div class="two"><div class="panel"><h2>Editor experimental de C</h2><p>Escreva seu programa. Esta demonstração valida a estrutura básica localmente; <strong>não compila nem executa C</strong>.</p><textarea id="codeInput" class="editor" spellcheck="false" aria-label="Código C"></textarea><div style="margin-top:14px"><button class="button" onclick="validateCode()">Analisar estrutura</button> <button class="button secondary" onclick="resetCode()">Restaurar exemplo</button></div><div id="output" class="feedback" aria-live="polite">Aguardando análise...</div></div><div class="panel"><h2>Próxima evolução</h2><p>O executor real usará GCC em serviço isolado, com limites de recursos e testes automatizados. Nenhum código digitado aqui é enviado a um servidor.</p></div></div>`}
function validateCode(){editorText=document.getElementById('codeInput').value;const checks=[[/#include\s*<stdio\.h>/,'Inclusão de stdio.h'],[/\bint\s+main\s*\(/,'Função main'],[/\bprintf\s*\(/,'Chamada de printf'],[/\breturn\s+0\s*;/,'Retorno zero']];const missing=checks.filter(([r])=>!r.test(editorText)).map(x=>x[1]);document.getElementById('output').innerHTML=missing.length?`<span class="error">Elementos não encontrados: ${missing.join(', ')}. Esta análise não garante compilação.</span>`:'<span class="success">Estrutura básica encontrada! Atenção: isso não garante que o código compile ou produza a saída correta.</span>'}function resetCode(){editorText='#include <stdio.h>\n\nint main(void) {\n    printf("Olá, Codexia!\\n");\n    return 0;\n}';render()}
function achievements(){return `<div class="cards"><div class="panel"><div class="achievement">🚀</div><h2>Primeiro passo</h2><p>${state.completed.length>=1?'Desbloqueada!':'Conclua sua primeira lição.'}</p></div><div class="panel"><div class="achievement">⚡</div><h2>100 XP</h2><p>${state.xp>=100?'Desbloqueada!':'Acumule 100 XP.'}</p></div><div class="panel"><div class="achievement">🏆</div><h2>Trilha concluída</h2><p>${state.completed.length===lessons.length?'Desbloqueada!':'Conclua as quatro lições demonstrativas.'}</p></div></div>`}
function profile(){return `<div class="panel"><h2>Perfil de demonstração</h2><p>Estudante Codexia · Linguagem C</p><div class="listrow">XP total: ${state.xp}</div><div class="listrow">Lições concluídas: ${state.completed.length}/${lessons.length}</div><div class="listrow">Respostas verificadas: ${state.attempts}</div><p>O progresso é armazenado apenas neste navegador usando localStorage. Não existe conta nem sincronização nesta versão.</p><button class="button secondary" onclick="if(confirm('Apagar o progresso local desta demonstração?')){state={...defaults,completed:[]};save();render()}">Limpar progresso local</button></div>`}
function render(){document.getElementById('nav').innerHTML=navHTML();document.getElementById('mobileNav').innerHTML=navHTML(true);document.getElementById('xpBadge').textContent='⚡ '+state.xp+' XP';document.getElementById('title').textContent=({dashboard:'Dashboard',trilha:'Sua trilha de C',lesson:'Hora de praticar',editor:'Laboratório C',conquistas:'Conquistas',perfil:'Seu perfil'})[page];document.getElementById('content').innerHTML=({dashboard,trilha,lesson,editor,conquistas,perfil})[page]();if(page==='editor')document.getElementById('codeInput').value=editorText}render();
</script></body></html>
